<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e2dcd2" />
    <title>油画笔触显影原型｜白兔</title>
    <link rel="stylesheet" href="./paint-reveal.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <header class="prototype-header">
        <span>笔触显影原型</span>
        <button id="replay" type="button">重新播放</button>
      </header>

      <nav class="art-switcher" aria-label="选择测试作品">
        <a id="homeMode" href="?art=home">首页主视觉</a>
        <a id="rabbitMode" href="?art=rabbit">白兔</a>
      </nav>

      <section class="art-stage" aria-label="《白兔》油画笔触显影演示">
        <canvas id="paintCanvas"></canvas>
        <div class="loading-label" id="loadingLabel">正在准备画布</div>
      </section>

      <section class="art-label">
        <p id="chapterLabel">各自成章</p>
        <h1 id="artworkTitle">白兔</h1>
        <h2 id="artistName">吴偲</h2>
        <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
        <small id="statusText">大笔触建立画面</small>
      </section>
    </main>
    <script type="module" src="./paint-reveal.js"></script>
  </body>
</html>
